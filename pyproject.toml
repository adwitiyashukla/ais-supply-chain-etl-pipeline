[project]
name = "waybill"
version = "0.1.0"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
include = ["waybill*"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
