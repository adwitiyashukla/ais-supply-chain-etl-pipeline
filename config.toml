[paths]
root = "data"
raw = "data/raw"
lake = "data/lake"
checkpoints = "data/checkpoints"
reports = "data/reports"
tmp = "data/tmp"

[spark]
master = "local[*]"
driver_memory = "4g"
shuffle_partitions = 32
aqe = true
broadcast_threshold_mb = 32
max_partition_mb = 96
log_level = "ERROR"

[window]
start_date = "2024-01-01"
days = 3

[ais]
source = "files"
url_template = "https://ocmgeodatastor1.blob.core.windows.net/marinecadastre/ais{year}/ais-{year}-{month}-{day}.parquet"
vessels = 6000
ping_interval_seconds = 80
class_b_share = 0.34
gap_share = 0.03
duplicate_rate = 0.004
corrupt_rate = 0.003
late_share = 0.02
keep_raw_days = 1

[cpg]
plants = 12
distribution_centers = 20
customers = 240
skus = 500
orders_per_day = 120000
max_lines_per_order = 4
import_share = 0.28
containers_per_call = 60
promised_transit_days = 5
inland_transit_hours = 34.0

[ports]
radius_km = 14.0
berth_speed_knots = 0.7
min_berth_minutes = 45
call_gap_hours = 4
grid_degrees = 0.25

[quality]
max_null_rate = 0.02
min_bronze_rows = 1000
max_quarantine_rate = 0.05
fail_on_error = true

[stream]
files_per_trigger = 1
watermark_minutes = 120
trigger_seconds = 5
dedupe_minutes = 30
days = 1

[tuning]
enabled = true
sample_days = 1
salt_buckets = 24
naive_shuffle_partitions = 200
